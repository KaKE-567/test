name: Build ArtixV5 Kernel

on:
  workflow_dispatch:
  push:
    branches:
      - lineage-17.1

jobs:
  build:
    name: Build Kernel
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          ref: lineage-17.1
          fetch-depth: 1

      - name: Setup build environment
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git \
            gnupg gperf libncurses5-dev libssl-dev libxml2-utils \
            lzop pngcrush python3 rsync schedtool squashfs-tools \
            xsltproc zip zlib1g-dev libelf-dev python-is-python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup Proton Clang 13
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $HOME/clang
          echo "$HOME/clang/bin" >> $GITHUB_PATH
          $HOME/clang/bin/clang --version

      - name: Integrate RKSU (rsuntk KernelSU)
        run: |
          curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" | bash -s main

      - name: Build kernel
        run: |
          export PATH="$HOME/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC="clang"
          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CROSS_COMPILE="aarch64-linux-gnu-"
          export CROSS_COMPILE_ARM32="arm-linux-gnueabi-"

          mkdir -p out

          # Generate config with Clang specified
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- curtana_defconfig

          # Build kernel with pipefail
          set -o pipefail
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz-dtb dtbo.img 2>&1 | tee build.log

      - name: Package kernel (AnyKernel3)
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3
          # Find kernel image
          if [ -f out/arch/arm64/boot/Image.gz-dtb ]; then
            cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
          elif [ -f out/arch/arm64/boot/Image.gz ]; then
            cp out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          elif [ -f out/arch/arm64/boot/Image ]; then
            cp out/arch/arm64/boot/Image AnyKernel3/Image
          fi
          [ -f out/arch/arm64/boot/dtbo.img ] && cp out/arch/arm64/boot/dtbo.img AnyKernel3/
          cd AnyKernel3
          zip -r9 ../ArtixV5-4.14.117-$(date +%Y%m%d-%H%M).zip * -x .git README.md

      - name: Upload kernel zip
        uses: actions/upload-artifact@v4
        with:
          name: ArtixV5-Kernel
          path: ArtixV5-*.zip
          retention-days: 7

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3
